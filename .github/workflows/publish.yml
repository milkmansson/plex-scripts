name: Publish to PyPI

# Runs when a GitHub release is created. A pre-release goes to TestPyPI. A full release
# goes to PyPI, whether it is created as one or a pre-release is changed into one.
# See RELEASING.md.
on:
  release:
    types: [prereleased, released]

permissions:
  contents: read

jobs:
  build:
    name: Test and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install
        run: python -m pip install --upgrade pip build twine && python -m pip install -e '.[dev]'

      - name: Tag must match the package version
        env:
          TAG: ${{ github.event.release.tag_name }}
        run: |
          version=$(python -c "import plextool; print(plextool.__version__)")
          meta=$(python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])")
          if [ "$version" != "$meta" ]; then
            echo "plextool/__init__.py says $version but pyproject.toml says $meta"; exit 1
          fi
          if [ "${TAG#v}" != "$version" ]; then
            echo "Release tag $TAG does not match package version $version"; exit 1
          fi

      - name: Lint
        run: ruff check .

      - name: Test
        run: pytest -q

      - name: Build
        run: python -m build

      - name: Check the package
        run: twine check dist/*

      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish-testpypi:
    name: Publish to TestPyPI
    needs: build
    if: github.event.action == 'prereleased'
    runs-on: ubuntu-latest
    environment: testpypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1
        with:
          repository-url: https://test.pypi.org/legacy/

  publish-pypi:
    name: Publish to PyPI
    needs: build
    if: github.event.action == 'released'
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - uses: pypa/gh-action-pypi-publish@release/v1

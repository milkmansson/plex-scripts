[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plextool"
version = "2.1.0"
description = "Maintenance helpers for a Plex Media Server"
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["plexapi>=4.15"]

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[project.scripts]
plextool = "plextool.cli:main"

[tool.setuptools]
packages = ["plextool"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]

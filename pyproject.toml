[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "plextool"
version = "3.0.0"
description = "Maintenance helpers for a Plex Media Server"
keywords = ["plex", "plex-media-server", "plexapi", "recently-added", "duplicates", "watched", "subtitles", "cli"]
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.9"
dependencies = ["plexapi>=4.18", "pyjwt[crypto]"]

[project.optional-dependencies]
qr = ["segno"]
dev = ["pytest", "ruff", "segno"]

[project.scripts]
plextool = "plextool.cli:main"

[tool.setuptools]
packages = ["plextool"]

[tool.ruff]
line-length = 110

[tool.pytest.ini_options]
testpaths = ["tests"]
